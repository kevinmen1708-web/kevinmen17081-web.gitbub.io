<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Voleibol</title>
    <style>
        /* Estilos base provistos originalmente adaptados a fondo negro */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .tarjeta {
            background-color: White;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }

        .numero {
            display: block;
            font-size: 3rem;
            color: #4a90e2;
            margin: 20px 0;
        }

        /* Estilos adicionales para mantener la estética y usabilidad */
        h1 {
            font-size: 1.4rem;
            color: #333333;
            margin-top: 0;
            margin-bottom: 10px;
        }

        p {
            font-size: 0.95rem;
            color: #666666;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .botones-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            background-color: #4a90e2;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s ease;
            box-sizing: border-box;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .btn:hover {
            background-color: #357abd;
        }

        .btn-secundario {
            background-color: #27F5A3;
        }

        .btn-secundario:hover {
            background-color: #1dc585;
        }

        .btn-regresar {
            background-color: #333333;
            color: white;
        }

        .btn-regresar:hover {
            background-color: #111111;
        }

        /* Control de secciones dinámicas */
        .seccion {
            display: none;
        }

        .seccion.activa {
            display: block;
        }
    </style>
</head>
<body>

    <div class="tarjeta">
        <!-- PÁGINA PRINCIPAL -->
        <div id="home" class="seccion activa">
            <h1>Mundo Voleibol</h1>
            <span class="numero">🏐</span>
            <p>Explora los sitios web oficiales para conocer todo sobre el voleibol en Guatemala y el mundo.</p>
            
            <div class="botones-container">
                <!-- Botón 1: Federación Nacional de Voleibol de Guatemala -->
                <a href="https://fedevoleibolguate.gt/" target="_blank" rel="noopener noreferrer" class="btn">Fed. Voleibol Guatemala</a>
                
                <!-- Botón 2: Volleyball World -->
                <a href="https://en.volleyballworld.com/" target="_blank" rel="noopener noreferrer" class="btn btn-secundario">Volleyball World</a>

                <!-- Botón para ver sección interna -->
                <button class="btn btn-regresar" onclick="mostrarSeccion('info')">Ver Información Extra</button>
            </div>
        </div>

        <!-- SECCIÓN INTERNA CON OPCIÓN DE REGRESAR -->
        <div id="info" class="seccion">
            <h1>Sobre el Voleibol</h1>
            <span class="numero">ℹ️</span>
            <p>El voleibol es un deporte de equipo donde dos agrupaciones se enfrentan en una cancha dividida por una red central.</p>
            
            <div class="botones-container">
                <!-- Botón para regresar al inicio -->
                <button class="btn btn-regresar" onclick="mostrarSeccion('home')">Regresar al Inicio</button>
            </div>
        </div>
    </div>

    <script>
        // Función en JavaScript para alternar entre la vista principal y la interna
        function mostrarSeccion(idSeccion) {
            const secciones = document.querySelectorAll('.seccion');
            secciones.forEach(sec => sec.classList.remove('activa'));
            document.getElementById(idSeccion).classList.add('activa');
        }
    </script>

</body>
</html>
